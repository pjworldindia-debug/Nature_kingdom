<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Kingdom | Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: "#2c4a2e",
                        "cream-bg": "#faf6f0",
                        "gold-accent": "#c9913c"
                    },
                    fontFamily: {
                        "product-title": ["Cormorant Garamond"],
                        "body-main": ["DM Sans"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cream-bg flex items-center justify-center min-h-screen font-body-main">
    <div class="bg-white p-10 rounded-2xl shadow-xl w-96 border border-gray-100">
        <h1 class="font-product-title text-4xl text-forest text-center mb-2">Nature Kingdom</h1>
        <p class="text-center text-sm text-gray-500 mb-8 uppercase tracking-widest font-semibold">Admin Portal</p>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="username" class="w-full px-4 py-2 border rounded-lg focus:ring-forest focus:border-forest" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:ring-forest focus:border-forest" required>
            </div>
            <div id="errorMsg" class="text-red-500 text-sm hidden">Invalid credentials</div>
            <button type="submit" class="w-full bg-forest text-white py-2 rounded-lg hover:bg-opacity-90 transition-all font-medium mt-4">Sign In</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('adminToken', data.token);
                    window.location.href = '/dashboard.html';
                } else {
                    document.getElementById('errorMsg').classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
            }
        });

        // Check if already logged in
        if (localStorage.getItem('adminToken')) {
            window.location.href = '/dashboard.html';
        }
    </script>
</body>
</html>
