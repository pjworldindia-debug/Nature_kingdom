<div class="max-w-[1200px] mx-auto px-8 pt-32 pb-20">
    <div class="mb-12 border-b border-border-warm pb-6">
        <h1 class="font-hero-lg text-[48px] text-forest">Your Cart</h1>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
        <!-- Cart Items -->
        <div class="lg:col-span-8">
            <div id="cartItems" class="space-y-6">
                <!-- Items populated via JS -->
                <div class="animate-pulse">
                    <div class="h-24 bg-surface-warm rounded-xl mb-4"></div>
                    <div class="h-24 bg-surface-warm rounded-xl mb-4"></div>
                </div>
            </div>
        </div>

        <!-- Order Summary -->
        <div class="lg:col-span-4">
            <div class="bg-surface-warm p-8 rounded-xl shadow-[0_4px_30px_rgba(0,0,0,0.03)] border border-border-warm sticky top-32">
                <h2 class="font-product-title text-2xl text-forest mb-6">Order Summary</h2>
                
                <div class="space-y-4 border-b border-border-warm pb-6 mb-6">
                    <div class="flex justify-between text-gray-text font-body-main">
                        <span>Subtotal</span>
                        <span id="cartSubtotal">₹0.00</span>
                    </div>
                    <div class="flex justify-between text-gray-text font-body-main">
                        <span>Shipping</span>
                        <span>Free</span>
                    </div>
                </div>
                
                <div class="flex justify-between font-stat-value text-xl text-forest mb-8">
                    <span>Total</span>
                    <span id="cartTotal">₹0.00</span>
                </div>
                
                <div id="shippingAddressContainer" class="mb-6 space-y-3 hidden">
                    <h3 class="font-product-title text-xl text-forest">Shipping Address</h3>
                    <input type="text" id="shipName" placeholder="Full Name" class="w-full px-4 py-3 rounded-lg border border-border-warm bg-surface focus:border-forest outline-none transition-colors" required>
                    <input type="text" id="shipLine1" placeholder="Address Line 1" class="w-full px-4 py-3 rounded-lg border border-border-warm bg-surface focus:border-forest outline-none transition-colors" required>
                    <input type="text" id="shipLine2" placeholder="Address Line 2 (Optional)" class="w-full px-4 py-3 rounded-lg border border-border-warm bg-surface focus:border-forest outline-none transition-colors">
                    <div class="flex gap-3">
                        <input type="text" id="shipCity" placeholder="City" class="w-1/2 px-4 py-3 rounded-lg border border-border-warm bg-surface focus:border-forest outline-none transition-colors" required>
                        <input type="text" id="shipState" placeholder="State" class="w-1/2 px-4 py-3 rounded-lg border border-border-warm bg-surface focus:border-forest outline-none transition-colors" required>
                    </div>
                    <div class="flex gap-3">
                        <input type="text" id="shipPin" placeholder="PIN Code" class="w-1/2 px-4 py-3 rounded-lg border border-border-warm bg-surface focus:border-forest outline-none transition-colors" required>
                        <input type="text" id="shipCountry" placeholder="Country" value="India" class="w-1/2 px-4 py-3 rounded-lg border border-border-warm bg-surface focus:border-forest outline-none transition-colors" required>
                    </div>
                </div>

                <button id="checkoutBtn" class="w-full py-4 bg-forest text-on-primary font-button-text rounded-full hover:bg-forest-light transition-all shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                    Proceed to Checkout
                </button>
                <div id="checkoutError" class="text-error text-sm text-center mt-4 hidden"></div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const cartItemsContainer = document.getElementById('cartItems');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const checkoutError = document.getElementById('checkoutError');
        
        let isGuest = false;

        async function loadCart() {
            try {
                let cart = [];
                isGuest = false;
                
                const res = await fetch('/api/cart');
                if (!res.ok) {
                    if (res.status === 401) {
                        isGuest = true;
                        // Build guest cart by fetching products catalog and merging with localStorage
                        const guestCartStr = localStorage.getItem('guestCart');
                        const guestCart = guestCartStr ? JSON.parse(guestCartStr) : [];
                        
                        if (guestCart.length > 0) {
                            const prodRes = await fetch('/api/products');
                            if (prodRes.ok) {
                                const products = await prodRes.json();
                                cart = guestCart.map(gc => {
                                    const p = products.find(prod => prod.id === gc.productId);
                                    if (p) {
                                        return {
                                            id: gc.productId, // Use productId as id for guest cart
                                            quantity: gc.quantity,
                                            name: p.name,
                                            price: p.price,
                                            slug: p.slug,
                                            images: p.images
                                        };
                                    }
                                    return null;
                                }).filter(Boolean);
                            }
                        }
                    } else {
                        throw new Error('Failed to load cart');
                    }
                } else {
                    cart = await res.json();
                }
                
                if (!Array.isArray(cart) || cart.length === 0) {
                    cartItemsContainer.innerHTML = `
                        <div class="py-12 flex flex-col items-center justify-center border-2 border-dashed border-border-warm rounded-xl bg-surface-warm">
                            <span class="material-symbols-outlined text-[48px] text-surface-dim mb-4">shopping_bag</span>
                            <p class="font-body-main text-gray-text mb-4">Your cart is empty.</p>
                            <a href="/#collection" class="text-forest font-bold hover:underline">Shop Now</a>
                        </div>
                    `;
                    checkoutBtn.disabled = true;
                    document.getElementById('cartSubtotal').innerText = '₹0.00';
                    document.getElementById('cartTotal').innerText = '₹0.00';
                    return;
                }
                
                let html = '';
                let total = 0;
                
                cart.forEach(item => {
                    const price = parseFloat(item.price);
                    const qty = item.quantity;
                    const itemTotal = price * qty;
                    total += itemTotal;
                    
                    const imgUrl = item.images ? (typeof item.images === 'string' ? JSON.parse(item.images)[0]?.url : item.images[0]?.url) : null;
                    
                    html += `
                    <div class="flex items-center gap-6 p-4 bg-surface-warm border border-border-warm rounded-xl relative group">
                        <div class="w-24 h-24 bg-cream-bg rounded-lg flex-shrink-0 flex items-center justify-center border border-border-warm text-surface-dim overflow-hidden">
                             ${imgUrl ? `<img src="${imgUrl}" class="w-full h-full object-cover">` : `<span class="material-symbols-outlined text-[40px]">eco</span>`}
                        </div>
                        <div class="flex-1">
                            <h3 class="font-product-title text-xl text-forest">${item.name}</h3>
                            <p class="font-stat-value text-forest mt-1">₹${price.toFixed(2)}</p>
                            
                            <div class="flex items-center gap-4 mt-4">
                                <div class="w-28 border border-outline rounded-full flex items-center justify-between p-1 bg-cream-bg">
                                    <button type="button" class="w-7 h-7 flex items-center justify-center text-gray-text hover:text-forest font-bold text-lg" onclick="updateQty(${item.id}, ${qty - 1})">−</button>
                                    <span class="font-stat-value text-sm text-forest">${qty}</span>
                                    <button type="button" class="w-7 h-7 flex items-center justify-center text-gray-text hover:text-forest font-bold text-lg" onclick="updateQty(${item.id}, ${qty + 1})">+</button>
                                </div>
                                <button type="button" class="text-gray-text hover:text-error transition-colors flex items-center gap-1 text-sm font-button-text" onclick="removeItem(${item.id})">
                                    <span class="material-symbols-outlined text-[16px]">delete</span> Remove
                                </button>
                            </div>
                        </div>
                        <div class="font-stat-value text-lg text-forest absolute top-4 right-6">
                            ₹${itemTotal.toFixed(2)}
                        </div>
                    </div>
                    `;
                });
                
                cartItemsContainer.innerHTML = html;
                document.getElementById('cartSubtotal').innerText = `₹${total.toFixed(2)}`;
                document.getElementById('cartTotal').innerText = `₹${total.toFixed(2)}`;
                checkoutBtn.disabled = false;
                
                if (!isGuest && cart.length > 0) {
                    document.getElementById('shippingAddressContainer').classList.remove('hidden');
                } else {
                    document.getElementById('shippingAddressContainer').classList.add('hidden');
                }
                
            } catch (err) {
                console.error(err);
                cartItemsContainer.innerHTML = '<p class="text-error">Failed to load cart items.</p>';
            }
        }
        
        window.updateQty = async (id, newQty) => {
            if (newQty < 1) {
                return window.removeItem(id);
            }
            if (isGuest) {
                let guestCart = JSON.parse(localStorage.getItem('guestCart') || '[]');
                const item = guestCart.find(gc => gc.productId === id);
                if (item) item.quantity = newQty;
                localStorage.setItem('guestCart', JSON.stringify(guestCart));
                loadCart();
                return;
            }
            try {
                const res = await fetch(`/api/cart/${id}`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'CSRF-Token': window.csrfToken,
                        'X-CSRF-Token': window.csrfToken
                    },
                    body: JSON.stringify({ quantity: newQty, _csrf: window.csrfToken })
                });
                if (res.ok) {
                    loadCart();
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Failed to update quantity', 'error');
                }
            } catch (err) {
                console.error(err);
            }
        }
        
        window.removeItem = async (id) => {
            if (isGuest) {
                let guestCart = JSON.parse(localStorage.getItem('guestCart') || '[]');
                guestCart = guestCart.filter(gc => gc.productId !== id);
                localStorage.setItem('guestCart', JSON.stringify(guestCart));
                loadCart();
                return;
            }
            try {
                const res = await fetch(`/api/cart/${id}`, {
                    method: 'DELETE',
                    headers: { 
                        'Content-Type': 'application/json',
                        'CSRF-Token': window.csrfToken,
                        'X-CSRF-Token': window.csrfToken
                    },
                    body: JSON.stringify({ _csrf: window.csrfToken })
                });
                if (res.ok) {
                    loadCart();
                }
            } catch (err) {
                console.error(err);
            }
        }
        
        checkoutBtn.addEventListener('click', async () => {
            if (isGuest) {
                window.location.href = '/account/login.html';
                return;
            }
            
            const shipName = document.getElementById('shipName').value;
            const shipLine1 = document.getElementById('shipLine1').value;
            const shipCity = document.getElementById('shipCity').value;
            const shipState = document.getElementById('shipState').value;
            const shipPin = document.getElementById('shipPin').value;
            const shipCountry = document.getElementById('shipCountry').value;
            
            if (!shipName || !shipLine1 || !shipCity || !shipState || !shipPin || !shipCountry) {
                checkoutError.innerText = 'Please fill out all required shipping fields.';
                checkoutError.classList.remove('hidden');
                return;
            }

            checkoutBtn.disabled = true;
            checkoutBtn.innerText = 'Processing...';
            try {
                const res = await fetch('/api/payment/initiate', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'CSRF-Token': window.csrfToken,
                        'X-CSRF-Token': window.csrfToken
                    },
                    body: JSON.stringify({
                        _csrf: window.csrfToken,
                        shipping_name: shipName,
                        shipping_address: {
                            line1: shipLine1,
                            line2: document.getElementById('shipLine2').value,
                            city: shipCity,
                            state: shipState,
                            pin: shipPin,
                            country: shipCountry
                        }
                    })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    window.location.href = data.redirectUrl;
                } else {
                    const err = await res.json();
                    checkoutError.innerText = err.error || 'Checkout failed';
                    checkoutError.classList.remove('hidden');
                    checkoutBtn.disabled = false;
                    checkoutBtn.innerText = 'Proceed to Checkout';
                }
            } catch (err) {
                console.error(err);
                checkoutError.innerText = 'Network error during checkout';
                checkoutError.classList.remove('hidden');
                checkoutBtn.disabled = false;
                checkoutBtn.innerText = 'Proceed to Checkout';
            }
        });
        
        loadCart();
    });
</script>
