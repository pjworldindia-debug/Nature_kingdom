<style>

            background-color: #faf6f0;
            color: #1c1c18;
            font-family: 'DM Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;

        }

    <script src="/js/app.js" defer></script>

<body class="bg-cream-bg text-on-background">

<!-- Top Navigation Bar -->
<nav class="fixed w-full top-0 z-50 bg-cream-bg/95 backdrop-blur-md shadow-sm border-b border-border-warm">
<div class="flex justify-between items-center max-w-[1200px] mx-auto px-8 h-20">
<a href="/" class="flex items-center gap-3">
<div class="w-8 h-8 bg-forest rounded-full flex items-center justify-center">
  <span class="material-symbols-outlined text-white text-[18px]">spa</span>
</div>
<div class="font-product-title text-2xl text-forest">
                Nature Kingdom
            </div>
</a>
<div class="flex items-center gap-6">
<a href="/" class="hover:text-forest transition-colors text-gray-text font-button-text">Home</a>
<button id="logoutBtn" class="hover:text-gold-accent transition-colors text-forest font-button-text font-bold">Sign Out</button>
</div>
</div>
</nav>

<div class="max-w-[1200px] mx-auto px-8 pt-32 pb-20">
    <div class="mb-12">
        <h1 class="font-hero-lg text-[48px] text-forest mb-2">Your Kingdom</h1>
        <p class="font-body-main text-gray-text">Manage your profile, orders, and linked accounts.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
        
        <!-- Sidebar Profile -->
        <div class="md:col-span-4">
            <div class="bg-surface-warm p-8 rounded-xl shadow-[0_4px_30px_rgba(0,0,0,0.03)] border border-border-warm text-center">
                <div id="userInfo">
                    <div class="animate-pulse flex flex-col items-center">
                        <div class="rounded-full bg-surface-dim h-20 w-20 mb-4"></div>
                        <div class="h-4 bg-surface-dim rounded w-3/4 mb-2"></div>
                        <div class="h-3 bg-surface-dim rounded w-1/2"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="md:col-span-8 space-y-8">
            
            <!-- Orders -->
            <div class="bg-surface-warm p-8 rounded-xl shadow-[0_4px_30px_rgba(0,0,0,0.03)] border border-border-warm">
                <h2 class="font-product-title text-2xl text-forest mb-6">Order History</h2>
                <div class="py-12 flex flex-col items-center justify-center border-2 border-dashed border-border-warm rounded-lg text-gray-text">
                    <span class="material-symbols-outlined text-[48px] text-surface-dim mb-4">inventory_2</span>
                    <p class="font-body-main">No orders found yet.</p>
                    <a href="/#collection" class="mt-4 text-forest font-bold hover:underline">Explore Products</a>
                </div>
            </div>

            <!-- Linked Accounts -->
            <div class="bg-surface-warm p-8 rounded-xl shadow-[0_4px_30px_rgba(0,0,0,0.03)] border border-border-warm">
                <h2 class="font-product-title text-2xl text-forest mb-2">Connected Accounts</h2>
                <p class="font-body-main text-gray-text mb-8">Link your social accounts for faster, passwordless sign-in.</p>
                
                <div class="space-y-4">
                    <!-- Google -->
                    <div class="flex items-center justify-between p-4 border border-border-warm rounded-lg bg-cream-bg">
                        <div class="flex items-center gap-3 font-button-text">
                            <svg class="h-6 w-6" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                            <span>Google</span>
                        </div>
                        <div id="googleAction">
                            <button class="px-4 py-2 border border-forest text-forest rounded-full font-button-text hover:bg-forest hover:text-white transition-all" onclick="window.location.href='/api/auth/google'">Connect</button>
                        </div>
                    </div>

                    <!-- GitHub -->
                    <div class="flex items-center justify-between p-4 border border-border-warm rounded-lg bg-cream-bg">
                        <div class="flex items-center gap-3 font-button-text">
                            <svg class="h-6 w-6" viewBox="0 0 24 24"><path fill="#1a1a1a" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                            <span>GitHub</span>
                        </div>
                        <div id="githubAction">
                            <button class="px-4 py-2 border border-forest text-forest rounded-full font-button-text hover:bg-forest hover:text-white transition-all" onclick="window.location.href='/api/auth/github'">Connect</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Fetch user profile
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) throw new Error('Not authenticated');
        const { user } = await res.json();
        
        let avatar = '';
        if (user.avatar_url) {
          avatar = `<img src="${user.avatar_url}" class="w-24 h-24 rounded-full mx-auto mb-4 border-2 border-border-warm shadow-sm">`;
        } else {
          avatar = `<div class="w-24 h-24 rounded-full bg-forest text-white flex items-center justify-center mx-auto mb-4 text-3xl shadow-sm"><span class="material-symbols-outlined text-[36px]">person</span></div>`;
        }
        
        document.getElementById('userInfo').innerHTML = `
          ${avatar}
          <h3 class="font-product-title text-2xl text-forest mb-1">${user.name}</h3>
          <p class="font-body-main text-sm text-gray-text break-all">${user.email || 'No email associated'}</p>
          <span class="inline-block mt-4 px-3 py-1 bg-sage-pale text-forest rounded-full font-label-caps text-[10px] font-bold tracking-widest">VERIFIED MEMBER</span>
        `;
      } catch (err) {
        window.location.href = '/account/login.html';
      }

      // 2. Fetch linked providers
      try {
        const res = await fetch('/api/auth/linked-providers');
        if (res.ok) {
          const { providers } = await res.json();
          providers.forEach(p => {
            const el = document.getElementById(`${p}Action`);
            if (el) {
              el.innerHTML = '<span class="font-button-text text-sage-accent flex items-center gap-1"><span class="material-symbols-outlined text-[18px]">check_circle</span> Connected</span>';
            }
          });
        }
      } catch (err) {
        console.error('Could not fetch linked providers');
      }
      
      // 3. Logout
      document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          await fetch('/api/auth/logout', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ _csrf: window.csrfToken })
          });
          window.location.href = '/';
        } catch(err) {
          console.error(err);
        }
      });
    });
</script>
</body>
</html>
