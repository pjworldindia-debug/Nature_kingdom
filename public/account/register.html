                    "cream-bg": "#faf6f0",

                    "on-tertiary": "#ffffff",
                    "inverse-primary": "#add0aa",
                    "tertiary-fixed": "#bcf0b9",
                    "on-secondary-fixed-variant": "#633f00",
                    "surface-variant": "#e6e2dc",

<style>
        body {
            background-color: #faf6f0;
            color: #1c1c18;
            font-family: 'DM Sans', sans-serif;
        }
    </style>
    <script src="/js/app.js" defer></script>
</head>
<body class="bg-cream-bg text-on-background min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-surface-warm p-10 rounded-xl shadow-[0_4px_30px_rgba(0,0,0,0.05)] border border-border-warm relative">
    <div class="absolute -top-6 left-1/2 transform -translate-x-1/2">
        <a href="/">
          <div class="w-12 h-12 bg-forest rounded-full flex items-center justify-center text-white shadow-lg">
             <span class="material-symbols-outlined text-white">spa</span>
          </div>
        </a>
    </div>
    
    <div class="text-center mt-4">
      <h2 class="font-product-title text-3xl text-forest mb-2">Join the Kingdom</h2>
      <p class="font-body-main text-gray-text mb-8">Create your account for exclusive access</p>
    </div>
    
    <form class="space-y-6" id="registerForm">
      <div>
        <label for="name" class="block font-label-caps text-[10px] text-gray-text mb-1 tracking-widest">FULL NAME</label>
        <input type="text" id="name" name="name" required class="w-full px-4 py-3 rounded-lg bg-cream-bg border border-border-warm focus:border-sage-accent focus:ring-1 focus:ring-sage-accent text-forest font-body-main outline-none transition-all">
      </div>
      <div>
        <label for="email" class="block font-label-caps text-[10px] text-gray-text mb-1 tracking-widest">EMAIL ADDRESS</label>
        <input type="email" id="email" name="email" required class="w-full px-4 py-3 rounded-lg bg-cream-bg border border-border-warm focus:border-sage-accent focus:ring-1 focus:ring-sage-accent text-forest font-body-main outline-none transition-all">
      </div>
      <div>
        <label for="password" class="block font-label-caps text-[10px] text-gray-text mb-1 tracking-widest">PASSWORD</label>
        <input type="password" id="password" name="password" required class="w-full px-4 py-3 rounded-lg bg-cream-bg border border-border-warm focus:border-sage-accent focus:ring-1 focus:ring-sage-accent text-forest font-body-main outline-none transition-all">
      </div>
      
      <button type="submit" class="w-full py-3 bg-forest text-on-primary font-button-text text-button-text rounded-full hover:bg-forest-light transition-all shadow-md mt-4">Create Account</button>
    </form>
    
    <p id="errorMsg" class="text-error text-center text-sm mt-4 hidden"></p>
    
    <p class="mt-8 text-center text-sm text-gray-text font-body-main">
      Already have an account? <a href="/account/login.html" class="text-forest font-bold hover:underline">Sign In</a>
    </p>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, _csrf: window.csrfToken })
        });
        
        if (res.ok) {
          window.location.href = '/account/dashboard.html';
        } else {
          const data = await res.json();
          const err = document.getElementById('errorMsg');
          err.innerText = data.error || 'Registration failed';
          err.classList.remove('hidden');
        }
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
